[env:nano33ble_sense_rev2]
platform = nordicnrf52
board = nano33ble
framework = arduino
build_flags =
    -DARDUINO_NANO33BLE_SENSE_REV2=1
 
; Libraries needed:
; - Arduino_BMI270_BMM150 for the built-in IMU on Nano 33 BLE Sense Rev2
; - DRV8833 motor control uses direct PWM pins and does not require a dedicated library
lib_deps =
    arduino-libraries/Arduino_BMI270_BMM150
 
monitor_speed = 115200